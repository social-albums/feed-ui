server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fallback para React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache largo para assets con hash
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
