# Connection: upgrade solo cuando el cliente pide un upgrade (WebSocket).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads de posts (content-service acepta hasta 100 MB por request).
    client_max_body_size 100m;

    # DNS de Docker. Con proxy_pass a una variable, nginx resuelve el nombre en
    # cada request en vez de al arrancar: levanta aunque el backend no esté arriba.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Proxy al backend (mismo esquema que vite.config.ts en dev) ───────────
    # El browser solo habla con nginx (mismo origen): sin CORS ni IPs hardcodeadas.
    location /api/auth/ {
        set $upstream http://auth-service:8080;
        rewrite ^/api/auth/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
    location /api/feed/ {
        set $upstream http://feed-service:8081;
        rewrite ^/api/feed/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
    location /api/content/ {
        set $upstream http://content-service:8082;
        rewrite ^/api/content/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
    location /api/social/ {
        set $upstream http://social-service:8083;
        rewrite ^/api/social/(.*)$ /$1 break;
        proxy_pass $upstream;
    }
    # notification-service: REST y WebSocket (/api/notification/ws). El upgrade
    # necesita HTTP/1.1 y reenviar Upgrade/Connection; el servidor manda un ping
    # cada 54 s, así que el read timeout tiene que ser mayor.
    location /api/notification/ {
        set $upstream http://notification-service:8084;
        rewrite ^/api/notification/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
    # Imágenes de MinIO (S3_BASE_URL=/my-ig-media en el backend)
    location /my-ig-media/ {
        set $upstream http://minio:9000;
        proxy_pass $upstream;
    }

    # Fallback para React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache largo para assets con hash
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
